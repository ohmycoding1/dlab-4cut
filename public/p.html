<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>디랩네컷 사진 받기</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    @font-face { font-family: 'PoppinsL'; font-weight: 600; src: url('fonts/poppins-600.woff') format('woff'); font-display: block; }
    :root { --bg: #0f131b; --panel: #171d28; --line: #2a3442; --ink: #f4f1ea; --muted: #8e98a8; --yellow: #ffd54a; --navy: #1b2733; color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; color: var(--ink); word-break: keep-all;
      background: radial-gradient(800px 400px at 80% -10%, #24345266, transparent 60%), var(--bg);
      display: flex; flex-direction: column; align-items: center; padding: 20px 16px calc(28px + env(safe-area-inset-bottom));
    }
    header { width: 100%; max-width: 480px; display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .logo { width: 104px; height: 27px; color: var(--ink); }
    header b { font-size: 18px; font-weight: 900; border-left: 1px solid var(--line); padding-left: 12px; }
    main { width: 100%; max-width: 480px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
    h1 { margin: 4px 0 0; font-size: 26px; letter-spacing: -.03em; }
    .sub { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.6; }
    .photo { height: min(calc(100svh - 330px), 640px); min-height: 240px; width: auto; aspect-ratio: 1 / 3; border-radius: 4px; background: var(--panel); box-shadow: 0 24px 60px #000a; overflow: hidden; display: grid; place-items: center; color: var(--muted); font-weight: 700; }
    .photo img { width: 100%; height: 100%; display: block; -webkit-touch-callout: default; }
    .btn { width: 100%; max-width: 340px; border: 0; border-radius: 16px; padding: 17px 20px; font: inherit; font-size: 18px; font-weight: 900; background: var(--yellow); color: var(--navy); cursor: pointer; box-shadow: 0 12px 30px #ffd54a33; }
    .btn:disabled { opacity: .5; }
    .tip { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .tip b { color: var(--ink); }
    footer { margin-top: 26px; color: #5d6676; font-size: 12px; text-align: center; line-height: 1.7; }
    footer a { color: var(--muted); }
    .hide { display: none !important; }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="dlab-mark" viewBox="0 0 765 198">
      <g transform="translate(0,-32)">
        <path d="M8 46 H154 V76 H757 V220 H118 V188 H8 Z" fill="none" stroke="currentColor" stroke-width="16" stroke-linejoin="miter"/>
        <g fill="currentColor">
          <text x="36" y="158.4" font-family="PoppinsL" font-weight="600" font-size="118">D</text>
          <circle cx="141" cy="133" r="9.5"/>
          <text x="168" y="189.4" font-family="PoppinsL" font-weight="600" font-size="118">L</text>
          <path d="M232 189.4 L276 106.6 L320 189.4 L301.3 189.4 L276 141.8 L250.7 189.4 Z"/>
          <text x="330" y="189.4" font-family="PoppinsL" font-weight="600" font-size="118">B</text>
          <rect x="428" y="106.6" width="10" height="82.8"/>
          <text x="462" y="171.1" font-family="PoppinsL" font-weight="600" font-size="66">CODING</text>
        </g>
      </g>
    </symbol>
  </svg>

  <header>
    <svg class="logo" role="img" aria-label="D·LAB CODING"><use href="#dlab-mark"/></svg>
    <b>디랩네컷</b>
  </header>

  <main>
    <div>
      <h1 id="title">네컷 사진이 도착했어요 📸</h1>
      <p class="sub" id="sub">GGF 2026 · 오늘은 내가 주인공!</p>
    </div>
    <div class="photo" id="photo"><span>불러오는 중…</span></div>
    <button class="btn" id="save" disabled>사진 저장하기</button>
    <p class="tip" id="tip">버튼이 안 되면 <b>사진을 길게 눌러</b> ‘사진 앱에 저장’을 고르세요.</p>
  </main>

  <footer>
    디랩코딩 순천신대캠퍼스<br>
    <span id="keep"></span>
  </footer>

  <script type="module">
    import { FIREBASE_SHARE, isPhotoId, photoURL } from './js/share-config.js';
    const $ = id => document.getElementById(id);
    const id = new URLSearchParams(location.search).get('id');
    $('keep').textContent = `사진은 ${FIREBASE_SHARE.keepDays}일 뒤 자동으로 지워져요`;

    function fail(title, sub) {
      $('title').textContent = title;
      $('sub').textContent = sub;
      $('photo').innerHTML = '<span>😢</span>';
      $('save').classList.add('hide');
      $('tip').classList.add('hide');
    }

    let blob = null;
    if (!isPhotoId(id)) {
      fail('사진 주소가 올바르지 않아요', 'QR 코드를 다시 찍어 주세요.');
    } else {
      try {
        const resp = await fetch(photoURL(id));
        if (!resp.ok) throw new Error(resp.status);
        blob = await resp.blob();
        const img = new Image();
        img.alt = '디랩네컷 사진';
        img.src = URL.createObjectURL(blob);
        await img.decode().catch(() => {});
        $('photo').replaceChildren(img);
        $('save').disabled = false;
      } catch (e) {
        fail('사진을 찾을 수 없어요', '보관 기간이 지났거나 아직 올라가는 중일 수 있어요. 잠시 뒤 다시 열어 주세요.');
      }
    }

    $('save').onclick = async () => {
      if (!blob) return;
      const file = new File([blob], `DLAB_FOURCUTS_${id.slice(0, 6)}.jpg`, { type: 'image/jpeg' });
      // 휴대폰: 공유 시트 → '이미지 저장'(iOS) / 갤러리 저장(Android)
      if (navigator.canShare?.({ files: [file] })) {
        try { await navigator.share({ files: [file], title: '디랩네컷' }); return; }
        catch (e) { if (e.name === 'AbortError') return; }
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(file);
      a.download = file.name;
      document.body.append(a);
      a.click();
      a.remove();
    };
  </script>
</body>
</html>
